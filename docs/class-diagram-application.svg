<text x="70" y="820" font-size="12" fill="#1F2937">Main creates LawFirmService, DataStore and ConsoleMenu</text>
<text x="70" y="837" font-size="12" fill="#1F2937">and hands the first two to the menu (constructor injection).</text>
<text x="70" y="854" font-size="12" fill="#1F2937">ConsoleMenu holds no business rules: it only reads input</text>
<text x="70" y="871" font-size="12" fill="#1F2937">and calls LawFirmService. Rules live in the service/domain.</text>
