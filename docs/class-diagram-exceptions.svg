<path d="M1436 880 v14 h14" fill="none" stroke="#CA8A04" stroke-width="1.2"/>
<text x="50" y="900" font-size="12" fill="#1F2937">ConsoleMenu catches ValidationException and CaseClosedException (together), LawFirmException, and IOException, and prints the message instead of crashing.</text>
