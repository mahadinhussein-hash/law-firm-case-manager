<text x="50" y="780" font-size="12" fill="#1F2937">Bad input or bad state:</text>
<text x="50" y="797" font-size="12" fill="#1F2937">empty name, rate &lt;= 0, bad email,</text>
<text x="50" y="814" font-size="12" fill="#1F2937">unknown id. Thrown by domain,</text>
<text x="50" y="831" font-size="12" fill="#1F2937">billing, service and DataStore.</text>
<path d="M330 760 h246 l14 14 v51 h-260 z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
<path d="M576 760 v14 h14" fill="none" stroke="#CA8A04" stroke-width="1.2"/>
<text x="340" y="780" font-size="12" fill="#1F2937">Logging hours on a closed case,</text>
<text x="340" y="797" font-size="12" fill="#1F2937">or closing a case twice.</text>
<text x="340" y="814" font-size="12" fill="#1F2937">Thrown by LegalCase.</text>
<path d="M640 760 h286 l14 14 v51 h-300 z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
<path d="M926 760 v14 h14" fill="none" stroke="#CA8A04" stroke-width="1.2"/>
<text x="650" y="780" font-size="12" fill="#1F2937">Lawyer already has 5 active</text>
<text x="650" y="797" font-size="12" fill="#1F2937">cases (Lawyer.MAX_ACTIVE_CASES).</text>
<text x="650" y="814" font-size="12" fill="#1F2937">Thrown by LawFirmService.</text>
<path d="M970 760 h306 l14 14 v51 h-320 z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
<path d="M1276 760 v14 h14" fill="none" stroke="#CA8A04" stroke-width="1.2"/>
<text x="980" y="780" font-size="12" fill="#1F2937">Lawyer already represents the</text>
<text x="980" y="797" font-size="12" fill="#1F2937">opposing party as a client.</text>
<text x="980" y="814" font-size="12" fill="#1F2937">Thrown by LawFirmService.</text>
<path d="M1200 470 h236 l14 14 v34 h-250 z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
<path d="M1436 470 v14 h14" fill="none" stroke="#CA8A04" stroke-width="1.2"/>
<text x="1210" y="490" font-size="12" fill="#1F2937">save() / load() in DataStore throw it</text>
<text x="1210" y="507" font-size="12" fill="#1F2937">when the file cannot be written or read.</text>
